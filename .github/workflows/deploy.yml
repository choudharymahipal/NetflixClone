name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href /NetflixClone/

      - name: Prepare Pages artifact
        run: |
          mkdir -p site

          if [ -d "dist/netflix-clone/browser" ]; then
            cp -R dist/netflix-clone/browser/. site/
          elif [ -d "dist/netflix-clone" ]; then
            cp -R dist/netflix-clone/. site/
          else
            echo "Angular build output not found."
            find dist -maxdepth 4 -type d || true
            exit 1
          fi

          cp site/index.html site/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4