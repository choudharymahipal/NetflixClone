<!-- HERO BANNER -->
<section class="banner" *ngIf="trending().length">
  <div class="banner-bg"
       [style.backgroundImage]="'url(https://image.tmdb.org/t/p/original' + trending()[0].backdrop_path + ')'">
  </div>

  <div class="overlay"></div>

  <div class="banner-content">
    <h1>{{ trending()[0].title || trending()[0].name }}</h1>

    <p>
      {{ trending()[0].overview }}
    </p>

    <div class="actions">
      <button class="btn primary">▶ Play</button>
      <button class="btn secondary">ℹ More Info</button>
    </div>
  </div>
</section>

<!-- MOVIE ROWS -->
 @if(trending().length > 0){
  <app-movie-list title="Trending Now" [movies]="trending()"></app-movie-list>
 }

  @if(popular().length > 0){
  <app-movie-list title="Popular Movies" [movies]="popular()"></app-movie-list>
 }
